services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-condominio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-condominio}
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-condominio} -d ${POSTGRES_DB:-condominio}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplica as migrações e o seed a cada deploy e encerra
  migrador:
    build: { context: ., target: migrador }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-condominio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-condominio}?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runner }
    restart: always
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-condominio}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-condominio}?schema=public
      UPLOAD_DIR: /app/uploads
    volumes:
      - fotos:/app/uploads
    ports:
      - "${PORTA_APP:-3001}:3000"
    depends_on:
      migrador: { condition: service_completed_successfully }

volumes:
  dados_postgres:
  fotos:
